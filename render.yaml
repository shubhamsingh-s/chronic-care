services:
  - type: web
    name: chronic-care-ai
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ADMIN_ACCESS_CODE
        value: ADMIN-2026-CHRONIC-CARE
      - key: SECRET_KEY
        value: super-secret-clinical-ai-jwt-key-2026-production-grade

      - key: MONGODB_URI
        sync: false
